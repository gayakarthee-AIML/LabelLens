version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./app:/app/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labellens
      POSTGRES_PASSWORD: labellens
      POSTGRES_DB: labellens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Kafka is architecture-ready but not required for the prototype to run
  # locally — inspection lifecycle events are emitted through a pluggable
  # EventBus interface (see app/services/event_bus.py) that no-ops when
  # KAFKA_ENABLED=false, and can be swapped for a real producer without
  # touching call sites.

volumes:
  pgdata:
  minio-data:
