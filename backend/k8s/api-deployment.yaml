apiVersion: apps/v1
kind: Deployment
metadata:
  name: labellens-api
  namespace: labellens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labellens-api
  template:
    metadata:
      labels:
        app: labellens-api
    spec:
      containers:
        - name: labellens-api
          image: labellens/api:latest   # build from backend/Dockerfile and push to your registry
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: labellens-api-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"   # PaddleOCR/YOLO inference is memory-hungry; tune per real load testing
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: labellens-api
  namespace: labellens
spec:
  selector:
    app: labellens-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
